[project]
name = "kildespor"
version = "1.0.0"
description = "Kildespor (Norwegian: 'source trail') — a deterministic agent that builds evidence-linked company profiles for Norwegian organisations from permitted public sources."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Arghya" }]
keywords = ["brreg", "norway", "company-data", "open-data", "agent"]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kildespor"]

[project.scripts]
kildespor = "kildespor.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
