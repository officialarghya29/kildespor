name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dev tooling
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check src tests

      - name: Type check
        run: uv run mypy src/kildespor --ignore-missing-imports

      - name: Run tests
        run: uv run pytest -q

      - name: Validate latest committed run (if present)
        run: |
          if ls data/profiles/run_*/_summary.json >/dev/null 2>&1; then
            LATEST=$(ls -d data/profiles/run_* | sort | tail -1)
            echo "validating $LATEST"
            uv run kildespor validate --run-dir "$LATEST"
          else
            echo "no run artifacts committed yet — skipping validate step"
          fi
